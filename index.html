<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VideoSplit — Comparador 60 FPS</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/whammy@1.0.0/whammy.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #2a2a2a;
    --accent: #e8ff47;
    --accent2: #ff4747;
    --text: #f0f0f0;
    --muted: #666;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    touch-action: manipulation;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }

  .logo {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent); }

  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: 20px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  main {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 900px;
    margin: 0 auto;
  }

  .upload-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .upload-zone {
    background: var(--surface);
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 24px 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent);
    background: #151500;
  }

  .upload-zone.loaded {
    border-style: solid;
    border-color: var(--accent);
    padding: 0;
  }

  .upload-zone.loaded video {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 10px;
    display: block;
  }

  .upload-icon {
    font-size: 28px;
    margin-bottom: 8px;
    display: block;
  }

  .upload-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    display: block;
    margin-bottom: 4px;
  }

  .upload-sub {
    font-size: 11px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .upload-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .video-name {
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent);
    padding: 6px 8px;
    background: rgba(232,255,71,0.08);
    border-radius: 0 0 10px 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .config-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }

  .config-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
    font-family: 'JetBrains Mono', monospace;
  }

  .config-row {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .config-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .config-group label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }

  .btn-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .btn-opt {
    flex: 1;
    min-width: 80px;
    padding: 10px 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .btn-opt:hover { border-color: var(--accent); color: var(--accent); }
  .btn-opt.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }

  .preview-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .preview-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .preview-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
  }

  .preview-res {
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent);
    background: rgba(232,255,71,0.1);
    padding: 3px 8px;
    border-radius: 20px;
  }

  #previewCanvas {
    width: 100%;
    display: block;
    background: #000;
    touch-action: none;
  }

  .playback-controls {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .seek-bar {
    width: 100%;
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }

  .seek-bar::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  .controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .ctrl-btns {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .btn-ctrl {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    user-select: none;
  }

  .btn-ctrl:hover { border-color: var(--accent); color: var(--accent); }
  .btn-ctrl.play-btn {
    width: 44px;
    height: 44px;
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-size: 18px;
  }

  .time-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .label-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .label-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
  }

  .label-input:focus { border-color: var(--accent); }
  .label-input::placeholder { color: var(--muted); }

  .export-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }

  .btn-export {
    width: 100%;
    padding: 16px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: #000;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    user-select: none;
  }

  .btn-export:hover { background: #d4e83a; transform: translateY(-1px); }
  .btn-export:disabled {
    background: var(--surface2);
    color: var(--muted);
    cursor: not-allowed;
    transform: none;
  }

  .progress-wrap {
    display: none;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }

  .progress-wrap.active { display: flex; }

  .progress-bar-outer {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-bar-inner {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    width: 0%;
    transition: width 0.3s;
  }

  .progress-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    text-align: center;
  }

  .divider-config {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .divider-color-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .color-swatch {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 2px solid var(--border);
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .color-swatch.active { border-color: var(--accent); }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  .range-label {
    font-size: 11px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    justify-content: space-between;
  }

  .alert {
    background: rgba(255,71,71,0.1);
    border: 1px solid rgba(255,71,71,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--accent2);
    display: none;
  }
  .alert.show { display: block; }

  .hidden { display: none !important; }

  @media (max-width: 480px) {
    .btn-opt { font-size: 11px; padding: 9px 6px; }
    .upload-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Video<span>Split</span></div>
  <div class="badge">COMPARADOR v3.0 (60 FPS)</div>
</header>

<main>
  <div class="upload-grid">
    <div class="upload-zone" id="zone1">
      <input type="file" accept="video/*" id="file1" onchange="loadVideo(1, this)">
      <span class="upload-icon">🎬</span>
      <span class="upload-label">Video A</span>
      <span class="upload-sub">tap para cargar</span>
    </div>
    <div class="upload-zone" id="zone2">
      <input type="file" accept="video/*" id="file2" onchange="loadVideo(2, this)">
      <span class="upload-icon">🎬</span>
      <span class="upload-label">Video B</span>
      <span class="upload-sub">tap para cargar</span>
    </div>
  </div>

  <div class="config-card">
    <div class="config-title">⚙ Configuración</div>
    <div class="config-row">
      <div class="config-group">
        <label>Disposición</label>
        <div class="btn-group">
          <button class="btn-opt active" onclick="setLayout('side')" id="btn-side">◫ Lado a lado</button>
          <button class="btn-opt" onclick="setLayout('top')" id="btn-top">▥ Arriba / Abajo</button>
        </div>
      </div>
      <div class="config-group">
        <label>Resolución de exportación</label>
        <div class="btn-group">
          <button class="btn-opt" onclick="setRes('720')" id="btn-720">720p</button>
          <button class="btn-opt active" onclick="setRes('1080')" id="btn-1080">1080p</button>
          <button class="btn-opt" onclick="setRes('1440')" id="btn-1440">1440p</button>
        </div>
      </div>
      <div class="config-group">
        <label>Etiquetas de video</label>
        <div class="label-row">
          <input class="label-input" id="labelA" placeholder="Video A" maxlength="20">
          <input class="label-input" id="labelB" placeholder="Video B" maxlength="20">
        </div>
      </div>
      <div class="config-group divider-config">
        <label>Línea divisoria</label>
        <div class="divider-color-row">
          <div class="color-swatch active" style="background:#e8ff47" onclick="setDivColor('#e8ff47', this)"></div>
          <div class="color-swatch" style="background:#ffffff" onclick="setDivColor('#ffffff', this)"></div>
          <div class="color-swatch" style="background:#ff4747" onclick="setDivColor('#ff4747', this)"></div>
          <div class="color-swatch" style="background:#00cfff" onclick="setDivColor('#00cfff', this)"></div>
          <div class="color-swatch" style="background:#333" onclick="setDivColor('transparent', this)" title="Sin línea"></div>
        </div>
        <div class="range-label">
          <span>Grosor</span>
          <span id="divSizeLabel">3px</span>
        </div>
        <input type="range" min="0" max="10" value="3" id="divSize" oninput="updateDivSize(this.value)">
      </div>
      <div class="config-group">
        <label>FPS de exportación</label>
        <div class="btn-group">
          <button class="btn-opt" onclick="setFPS(30)" id="btn-30">30 FPS</button>
          <button class="btn-opt active" onclick="setFPS(60)" id="btn-60">60 FPS</button>
        </div>
      </div>
    </div>
  </div>

  <div class="preview-section">
    <div class="preview-header">
      <span class="preview-title">▶ Preview</span>
      <span class="preview-res" id="resLabel">1080p</span>
    </div>
    <canvas id="previewCanvas"></canvas>
    <div class="playback-controls">
      <input type="range" class="seek-bar" id="seekBar" min="0" max="100" value="0" step="0.1" oninput="seek(this.value)">
      <div class="controls-row">
        <div class="ctrl-btns">
          <button class="btn-ctrl" onclick="skipTime(-5)" title="-5s">⏮</button>
          <button class="btn-ctrl play-btn" id="playBtn" onclick="togglePlay()">▶</button>
          <button class="btn-ctrl" onclick="skipTime(5)" title="+5s">⏭</button>
        </div>
        <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
        <button class="btn-ctrl" onclick="resetVideos()" title="Reiniciar">↺</button>
      </div>
    </div>
  </div>

  <div class="export-card">
    <div class="config-title">⬇ Exportar video</div>
    <div class="alert" id="alertMsg"></div>
    <button class="btn-export" id="exportBtn" onclick="startExport()">
      <span>🎞</span> Renderizar y descargar
    </button>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar-outer">
        <div class="progress-bar-inner" id="progressBar"></div>
      </div>
      <div class="progress-text" id="progressText">Preparando...</div>
    </div>
  </div>
</main>

<video id="vid1" playsinline preload="auto" style="display:none"></video>
<video id="vid2" playsinline preload="auto" style="display:none"></video>

<script>
// STATE
let layout = 'side';
let exportRes = '1080';
let divColor = '#e8ff47';
let divSize = 3;
let playing = false;
let animFrame = null;
let video1Loaded = false;
let video2Loaded = false;
let exportFPS = 60; // FPS de exportación (30 o 60)

const vid1 = document.getElementById('vid1');
const vid2 = document.getElementById('vid2');
const canvas = document.getElementById('previewCanvas');
const ctx = canvas.getContext('2d');

// RESOLUTION MAP
const RES_MAP = {
  '720':  { side: [1280, 360],  top: [640, 720]  },
  '1080': { side: [1920, 540],  top: [960, 1080] },
  '1440': { side: [2560, 720],  top: [1280, 1440]},
};

function getCanvasDims() {
  const r = RES_MAP[exportRes][layout];
  return { w: r[0], h: r[1] };
}

// LOAD VIDEO
function loadVideo(n, input) {
  if (!input.files[0]) return;
  const file = input.files[0];
  const url = URL.createObjectURL(file);
  const vid = n === 1 ? vid1 : vid2;
  const zone = document.getElementById('zone' + n);

  vid.src = url;
  vid.load();
  vid.onloadedmetadata = () => {
    if (n === 1) video1Loaded = true;
    else video2Loaded = true;

    zone.classList.add('loaded');
    zone.innerHTML = `
      <input type="file" accept="video/*" id="file${n}" onchange="loadVideo(${n}, this)">
      <video src="${url}" muted playsinline style="width:100%;height:120px;object-fit:cover;border-radius:10px 10px 0 0;display:block"></video>
      <div class="video-name">${file.name}</div>
    `;

    if (video1Loaded && video2Loaded) initPreview();
  };
}

// INIT PREVIEW
function initPreview() {
  updateCanvasSize();
  drawFrame();
  vid1.addEventListener('timeupdate', updateSeekBar);
}

function updateCanvasSize() {
  const { w, h } = getCanvasDims();
  canvas.width = w;
  canvas.height = h;
  canvas.style.maxHeight = '320px';
}

// DRAW
function drawFrame() {
  if (!video1Loaded || !video2Loaded) return;
  const { w, h } = getCanvasDims();
  ctx.clearRect(0, 0, w, h);

  const lA = document.getElementById('labelA').value || 'Video A';
  const lB = document.getElementById('labelB').value || 'Video B';

  if (layout === 'side') {
    drawVideoFit(vid1, 0, 0, w/2, h);
    drawVideoFit(vid2, w/2, 0, w/2, h);
    if (divColor !== 'transparent' && divSize > 0) {
      ctx.fillStyle = divColor;
      ctx.fillRect(w/2 - divSize/2, 0, divSize, h);
    }
    drawLabel(lA, 16, 16, 'left');
    drawLabel(lB, w/2 + 16, 16, 'left');
  } else {
    drawVideoFit(vid1, 0, 0, w, h/2);
    drawVideoFit(vid2, 0, h/2, w, h/2);
    if (divColor !== 'transparent' && divSize > 0) {
      ctx.fillStyle = divColor;
      ctx.fillRect(0, h/2 - divSize/2, w, divSize);
    }
    drawLabel(lA, 16, 16, 'left');
    drawLabel(lB, 16, h/2 + 16, 'left');
  }

  if (playing) animFrame = requestAnimationFrame(drawFrame);
}

function drawVideoFit(video, x, y, w, h) {
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (!vw || !vh) {
    ctx.fillStyle = '#111';
    ctx.fillRect(x, y, w, h);
    return;
  }
  const vAspect = vw / vh;
  const cAspect = w / h;
  let dx, dy, dw, dh;
  if (vAspect > cAspect) {
    dw = w; dh = w / vAspect;
    dx = x; dy = y + (h - dh) / 2;
  } else {
    dh = h; dw = h * vAspect;
    dy = y; dx = x + (w - dw) / 2;
  }
  ctx.fillStyle = '#000';
  ctx.fillRect(x, y, w, h);
  ctx.drawImage(video, dx, dy, dw, dh);
}

function drawLabel(text, x, y, align) {
  const fontSize = Math.max(canvas.width * 0.015, 14);
  ctx.font = `bold ${fontSize}px Syne, sans-serif`;
  const metrics = ctx.measureText(text);
  const pad = fontSize * 0.5;
  const bw = metrics.width + pad * 2;
  const bh = fontSize + pad;

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(ctx, x - pad/2, y - pad/2, bw, bh, 6);
  ctx.fill();

  ctx.fillStyle = '#e8ff47';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(text, x, y);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// PLAYBACK
function togglePlay() {
  if (!video1Loaded || !video2Loaded) {
    showAlert('Carga los dos videos primero');
    return;
  }
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? '⏸' : '▶';
  if (playing) {
    vid1.play();
    vid2.play();
    animFrame = requestAnimationFrame(drawFrame);
    vid1.addEventListener('ended', onEnded);
  } else {
    vid1.pause();
    vid2.pause();
    cancelAnimationFrame(animFrame);
  }
}

function onEnded() {
  playing = false;
  document.getElementById('playBtn').textContent = '▶';
  cancelAnimationFrame(animFrame);
  drawFrame();
}

function seek(val) {
  if (!video1Loaded) return;
  const t1 = (val / 100) * vid1.duration;
  const t2 = (val / 100) * vid2.duration;
  vid1.currentTime = t1;
  vid2.currentTime = t2;
  if (!playing) setTimeout(drawFrame, 100);
}

function skipTime(s) {
  vid1.currentTime = Math.max(0, vid1.currentTime + s);
  vid2.currentTime = Math.max(0, vid2.currentTime + s);
  if (!playing) setTimeout(drawFrame, 80);
}

function resetVideos() {
  vid1.currentTime = 0;
  vid2.currentTime = 0;
  if (!playing) setTimeout(drawFrame, 80);
}

function updateSeekBar() {
  if (!vid1.duration) return;
  const pct = (vid1.currentTime / vid1.duration) * 100;
  document.getElementById('seekBar').value = pct;
  document.getElementById('timeDisplay').textContent =
    `${fmt(vid1.currentTime)} / ${fmt(vid1.duration)}`;
}

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

// CONFIG SETTERS
function setLayout(l) {
  layout = l;
  document.getElementById('btn-side').classList.toggle('active', l === 'side');
  document.getElementById('btn-top').classList.toggle('active', l === 'top');
  updateCanvasSize();
  if (!playing) drawFrame();
}

function setRes(r) {
  exportRes = r;
  ['720','1080','1440'].forEach(x => {
    document.getElementById('btn-' + x).classList.toggle('active', x === r);
  });
  const labels = { '720':'720p','1080':'1080p','1440':'1440p' };
  document.getElementById('resLabel').textContent = labels[r];
  updateCanvasSize();
  if (!playing) drawFrame();
}

function setDivColor(c, el) {
  divColor = c;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  if (!playing) drawFrame();
}

function updateDivSize(v) {
  divSize = parseInt(v);
  document.getElementById('divSizeLabel').textContent = v + 'px';
  if (!playing) drawFrame();
}

function setFPS(fps) {
  exportFPS = fps;
  document.getElementById('btn-30').classList.toggle('active', fps === 30);
  document.getElementById('btn-60').classList.toggle('active', fps === 60);
}

// EXPORT CON WHAMMY (60 FPS OPTIMIZADO PARA S8 GEN 4)
async function startExport() {
  if (!video1Loaded || !video2Loaded) {
    showAlert('Carga los dos videos antes de exportar');
    return;
  }

  const exportBtn = document.getElementById('exportBtn');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');

  exportBtn.disabled = true;
  progressWrap.classList.add('active');

  const wasPlaying = playing;
  if (playing) togglePlay();

  const { w, h } = getCanvasDims();
  const duration = Math.min(vid1.duration, vid2.duration);
  const totalFrames = Math.floor(duration * exportFPS);
  const frameInterval = 1000 / exportFPS;

  // Canvas temporal para capturar frames
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = w;
  tempCanvas.height = h;
  const tempCtx = tempCanvas.getContext('2d');

  // Configura Whammy
  const recorder = new Whammy.Video(exportFPS);
  let framesCaptured = 0;
  let lastTime = performance.now();

  // Reinicia videos
  vid1.currentTime = 0;
  vid2.currentTime = 0;
  vid1.play();
  vid2.play();

  const startTime = performance.now();

  function captureFrame() {
    const now = performance.now();
    const elapsed = (now - startTime) / 1000;

    // Solo captura el frame si ha pasado el intervalo correcto
    if (now - lastTime >= frameInterval) {
      // Dibuja el frame actual en el canvas temporal
      tempCtx.clearRect(0, 0, w, h);
      const lA = document.getElementById('labelA').value || 'Video A';
      const lB = document.getElementById('labelB').value || 'Video B';

      if (layout === 'side') {
        drawVideoFitToCanvas(vid1, tempCtx, 0, 0, w/2, h);
        drawVideoFitToCanvas(vid2, tempCtx, w/2, 0, w/2, h);
        if (divColor !== 'transparent' && divSize > 0) {
          tempCtx.fillStyle = divColor;
          tempCtx.fillRect(w/2 - divSize/2, 0, divSize, h);
        }
        drawLabelToCanvas(tempCtx, lA, 16, 16, 'left', w, h);
        drawLabelToCanvas(tempCtx, lB, w/2 + 16, 16, 'left', w, h);
      } else {
        drawVideoFitToCanvas(vid1, tempCtx, 0, 0, w, h/2);
        drawVideoFitToCanvas(vid2, tempCtx, 0, h/2, w, h/2);
        if (divColor !== 'transparent' && divSize > 0) {
          tempCtx.fillStyle = divColor;
          tempCtx.fillRect(0, h/2 - divSize/2, w, divSize);
        }
        drawLabelToCanvas(tempCtx, lA, 16, 16, 'left', w, h);
        drawLabelToCanvas(tempCtx, lB, 16, h/2 + 16, 'left', w, h);
      }

      // Añade el frame al recorder
      recorder.add(tempCanvas);
      framesCaptured++;
      lastTime = now;
    }

    // Actualiza el progreso
    const pct = Math.min((framesCaptured / totalFrames) * 100, 100);
    progressBar.style.width = pct + '%';
    progressText.textContent = `Capturando... ${framesCaptured}/${totalFrames} (${Math.round(pct)}%) - ${fmt(elapsed)}s`;

    // Continúa o finaliza
    if (framesCaptured < totalFrames && elapsed < duration) {
      requestAnimationFrame(captureFrame);
    } else {
      vid1.pause();
      vid2.pause();
      
      // Finaliza la grabación
      progressText.textContent = 'Finalizando video...';
      const videoBlob = recorder.compile();
      const url = URL.createObjectURL(videoBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `videosplit_${exportRes}p_${exportFPS}fps_${Date.now()}.webm`;
      a.click();
      URL.revokeObjectURL(url);

      exportBtn.disabled = false;
      progressWrap.classList.remove('active');
      progressBar.style.width = '0%';
      progressText.textContent = 'Preparando...';
      if (wasPlaying) togglePlay();
    }
  }

  // Empieza la captura
  requestAnimationFrame(captureFrame);
}

// Funciones auxiliares para el canvas temporal
function drawVideoFitToCanvas(video, ctx, x, y, w, h) {
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (!vw || !vh) {
    ctx.fillStyle = '#111';
    ctx.fillRect(x, y, w, h);
    return;
  }
  const vAspect = vw / vh;
  const cAspect = w / h;
  let dx, dy, dw, dh;
  if (vAspect > cAspect) {
    dw = w; dh = w / vAspect;
    dx = x; dy = y + (h - dh) / 2;
  } else {
    dh = h; dw = h * vAspect;
    dy = y; dx = x + (w - dw) / 2;
  }
  ctx.fillStyle = '#000';
  ctx.fillRect(x, y, w, h);
  ctx.drawImage(video, dx, dy, dw, dh);
}

function drawLabelToCanvas(ctx, text, x, y, align, canvasWidth, canvasHeight) {
  const fontSize = Math.max(canvasWidth * 0.015, 14);
  ctx.font = `bold ${fontSize}px Syne, sans-serif`;
  const metrics = ctx.measureText(text);
  const pad = fontSize * 0.5;
  const bw = metrics.width + pad * 2;
  const bh = fontSize + pad;

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(ctx, x - pad/2, y - pad/2, bw, bh, 6);
  ctx.fill();

  ctx.fillStyle = '#e8ff47';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(text, x, y);
}

// ALERT
function showAlert(msg) {
  const el = document.getElementById('alertMsg');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4000);
}

// DRAG & DROP
['zone1','zone2'].forEach((id, i) => {
  const zone = document.getElementById(id);
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('video/')) {
      const input = document.getElementById('file' + (i+1));
      const dt = new DataTransfer();
      dt.items.add(file);
      input.files = dt.files;
      loadVideo(i+1, input);
    }
  });
});

// Redraw on label change
document.getElementById('labelA').addEventListener('input', () => { if (!playing) drawFrame(); });
document.getElementById('labelB').addEventListener('input', () => { if (!playing) drawFrame(); });
